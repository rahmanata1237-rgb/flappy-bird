<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>

<link href="https://fonts.cdnfonts.com/css/stranger-things" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body class="day">

<div id="game-container">
  <canvas id="game"></canvas>

  <!-- In-game UI -->
  <div id="ui">
    <div id="highScore">HIGH: 0</div>
    <div id="score">0</div>
  </div>

  <!-- START SCREEN -->
  <div id="startScreen" class="overlay">
    <h1>FLAPPY BIRD</h1>
    <button id="startBtn">START</button>
    <button id="settingsBtn">SETTINGS</button>
  </div>

  <!-- SETTINGS -->
  <div id="settingsScreen" class="overlay">
    <h1>SETTINGS</h1>

    <button id="soundBtn">SOUND: ON</button>
    <button id="themeBtn">THEME: DAY</button>

    <label>FPS</label>
    <select id="fpsSelect">
      <option value="10">10 FPS</option>
      <option value="15">15 FPS</option>
      <option value="20">20 FPS</option>
      <option value="30">30 FPS</option>
      <option value="60" selected>60 FPS</option>
      <option value="120">120 FPS</option>
      <option value="144">144 FPS</option>
      <option value="165">165 FPS</option>
    </select>

    <label>DIFFICULTY</label>
    <select id="levelSelect">
      <option value="easy">EASY</option>
      <option value="medium" selected>MEDIUM</option>
      <option value="hard">HARD</option>
      <option value="impossible">IMPOSSIBLE</option>
    </select>

    <button id="backBtn">BACK</button>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen" class="overlay">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <button id="restartBtn">RESTART</button>
  </div>
</div>

<script src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
